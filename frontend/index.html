<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Login | StudyTrack
  </title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="brand-mark">
        🕮
      </div>


      <h1>
        StudyTrack
      </h1>


      <p class="auth-subtitle">
        Sign in to manage your learning goals and track your progress.
      </p>


      <form id="loginForm">


        <div class="form-group">

          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >

        </div>


        <div
          id="loginMessage"
          class="message"
        ></div>


        <button
          class="primary-btn"
          type="submit"
        >
          Sign In
        </button>

      </form>


      <div class="auth-switch">

        Don't have an account?

        <a href="/register.html">
          Create account
        </a>

      </div>

    </section>

  </main>


  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>

</body>

</html>
